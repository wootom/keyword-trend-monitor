<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 대시보드 - 글로벌 뉴스 모니터링</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        toss: {
                            blue: '#3182f6',
                            blueDark: '#1b64da',
                            gray: '#4e5968',
                            lightGray: '#8b95a1',
                            bg: '#f9fafb',
                            card: '#ffffff',
                        }
                    },
                    fontFamily: {
                        toss: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- Pretendard Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }

        /* 토스 스타일 커스텀 */
        .toss-card {
            background-color: white;
            border-radius: 1rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            border: 1px solid #f3f4f6;
            overflow: hidden;
            transition: all 0.2s;
        }

        .toss-card:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .toss-btn {
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
        }

        .toss-btn-primary {
            background-color: #3182f6;
            color: white;
        }

        .toss-btn-primary:hover {
            background-color: #1b64da;
        }

        .toss-btn-secondary {
            background-color: #f3f4f6;
            color: #374151;
        }

        .toss-btn-secondary:hover {
            background-color: #e5e7eb;
        }

        /* 스크롤바 스타일 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }

        /* 로딩 애니메이션 */
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 스켈레톤 로딩 */
        .skeleton {
            background-color: #e5e7eb;
            border-radius: 0.25rem;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body class="bg-toss-bg min-h-screen">

    <!-- 로그인 화면 -->
    <div id="auth-screen" class="fixed inset-0 bg-toss-bg flex items-center justify-center p-4 z-50">
        <div class="toss-card w-full max-w-md p-8 animate-fade-in">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-toss-blue rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">접근 보호</h1>
                <p class="text-toss-lightGray mt-2">글로벌 뉴스 모니터링 시스템</p>
            </div>

            <form id="auth-form" class="space-y-4">
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">비밀번호</label>
                    <input type="password" id="password"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-toss-blue focus:ring-2 focus:ring-toss-blue/20 outline-none transition-all"
                        placeholder="비밀번호를 입력하세요" required>
                </div>
                <div id="auth-error" class="hidden bg-red-50 text-red-600 px-4 py-3 rounded-xl text-sm">
                    비밀번호가 올바르지 않습니다.
                </div>
                <button type="submit" class="w-full toss-btn toss-btn-primary py-3 text-base">
                    접속하기
                </button>
            </form>
        </div>
    </div>

    <!-- 메인 컨텐츠 -->
    <div id="main-content" class="hidden">

        <!-- 헤더 -->
        <header class="bg-white border-b border-gray-100 sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <div class="flex items-center gap-3">
                        <a href="global-news.html" class="text-toss-lightGray hover:text-toss-gray transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 19l-7-7 7-7" />
                            </svg>
                        </a>
                        <h1 id="page-title" class="text-lg font-bold text-gray-900">Task 대시보드</h1>
                    </div>
                    <nav class="flex items-center gap-2">
                        <a href="global-news.html"
                            class="text-sm text-toss-lightGray hover:text-toss-blue transition-colors px-3 py-2 rounded-lg hover:bg-gray-50">
                            Task 목록
                        </a>
                        <a href="ixio.html"
                            class="text-sm text-toss-lightGray hover:text-toss-blue transition-colors px-3 py-2 rounded-lg hover:bg-gray-50">
                            IXIO
                        </a>
                    </nav>
                </div>
            </div>
        </header>

        <!-- 메인 -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

            <!-- 액션 버튼 그룹 -->
            <div class="flex flex-wrap gap-3 mb-6">
                <button onclick="collectNow()" class="toss-btn toss-btn-primary">
                    <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                    </svg>
                    수집 실행
                </button>
                <button onclick="backfill30Days()" class="toss-btn toss-btn-secondary">
                    30일 백필
                </button>
                <button onclick="translateGemini()" class="toss-btn bg-violet-500 text-white hover:bg-violet-600">
                    🌐 번역
                </button>
                <button onclick="loadTaskData()" class="toss-btn toss-btn-secondary ml-auto">
                    <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    새로고침
                </button>
            </div>

            <!-- 통계 카드 그리드 -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                <div class="toss-card p-6">
                    <p class="text-sm text-toss-lightGray mb-1">총 언급량</p>
                    <p id="total-mentions" class="text-3xl font-bold text-gray-900">-</p>
                    <p id="date-range" class="text-xs text-toss-lightGray mt-1">-</p>
                </div>
                <div class="toss-card p-6">
                    <p class="text-sm text-toss-lightGray mb-1">오늘 언급량</p>
                    <p id="today-mentions" class="text-3xl font-bold text-toss-blue">-</p>
                    <p id="today-date" class="text-xs text-toss-lightGray mt-1">-</p>
                </div>
                <div class="toss-card p-6">
                    <p class="text-sm text-toss-lightGray mb-1">일평균</p>
                    <p id="avg-mentions" class="text-3xl font-bold text-gray-900">-</p>
                    <p class="text-xs text-toss-lightGray mt-1">전체 기간</p>
                </div>
                <div class="toss-card p-6">
                    <p class="text-sm text-toss-lightGray mb-1">최고 언급량</p>
                    <p id="peak-mentions" class="text-3xl font-bold text-violet-600">-</p>
                    <p id="peak-date" class="text-xs text-toss-lightGray mt-1">-</p>
                </div>
            </div>

            <!-- Task 정보 -->
            <div class="toss-card mb-8">
                <div class="px-6 py-4 border-b border-gray-100">
                    <h2 class="text-lg font-bold text-gray-900">Task 정보</h2>
                </div>
                <div class="p-6">
                    <div id="task-info-body" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="skeleton h-16"></div>
                        <div class="skeleton h-16"></div>
                        <div class="skeleton h-16"></div>
                        <div class="skeleton h-16"></div>
                    </div>
                </div>
            </div>

            <!-- 트렌드 차트 -->
            <div class="toss-card mb-8">
                <div class="px-6 py-4 border-b border-gray-100">
                    <h2 class="text-lg font-bold text-gray-900">일별 키워드 추이</h2>
                </div>
                <div class="p-6">
                    <div class="h-80 relative">
                        <canvas id="trend-chart"></canvas>
                    </div>
                </div>
            </div>

            <!-- 데이터 테이블 -->
            <div class="toss-card">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h2 class="text-lg font-bold text-gray-900">일별 상세 데이터</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full border-collapse">
                        <thead class="bg-gray-100">
                            <tr class="border-b-2 border-gray-300">
                                <th
                                    class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider border-r border-gray-200">
                                    날짜</th>
                                <th
                                    class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider border-r border-gray-200">
                                    기사제목</th>
                                <th
                                    class="px-6 py-3 text-center text-xs font-semibold text-gray-600 uppercase tracking-wider border-r border-gray-200">
                                    뉴스합계</th>
                                <th
                                    class="px-6 py-3 text-center text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                    전일 대비</th>
                            </tr>
                        </thead>
                        <tbody id="data-table-body" class="divide-y divide-gray-200">
                            <tr>
                                <td colspan="4" class="px-6 py-8 text-center text-toss-lightGray">
                                    <div class="flex flex-col items-center gap-2">
                                        <svg class="w-8 h-8 animate-spin text-toss-blue" fill="none"
                                            viewBox="0 0 24 24">
                                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                                stroke-width="4"></circle>
                                            <path class="opacity-75" fill="currentColor"
                                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                            </path>
                                        </svg>
                                        <span>데이터 로딩 중...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>

        <!-- 푸터 -->
        <footer class="bg-white border-t border-gray-100 mt-16">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 text-center text-sm text-toss-lightGray">
                © 2025 <span class="font-semibold text-gray-700">fovea</span>. All rights reserved.
            </div>
        </footer>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/global-news-task.js"></script>
</body>

</html>
